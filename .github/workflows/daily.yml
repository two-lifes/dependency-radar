name: Daily

# decisions 11: deletes expired guest reports and api_cache rows, resets the
# demo account. CRON_SECRET (also set in Vercel) and APP_URL are set by the author.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions: {}

jobs:
  daily:
    name: Run /api/cron/daily
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the daily endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/daily"
